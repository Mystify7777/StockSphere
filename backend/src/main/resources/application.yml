server:
  port: 8080

spring:
  application:
    name: stocksphere-backend

  devtools:
    restart:
      enabled: true

  datasource:
    url: jdbc:mysql://localhost:3306/stocksphere
    username: root
    password: 0990

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.security: INFO

app:
  api-prefix: /api

jwt:
  secret: change_this_to_long_random_secret_change_me_immediately_for_prod_32_bytes_min
  expiration-ms: 900000
