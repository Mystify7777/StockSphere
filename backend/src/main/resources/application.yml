server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: stocksphere-backend

  devtools:
    restart:
      enabled: true

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:stocksphere}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:0990}

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  api-prefix: /api

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET:change_this_to_long_random_secret_change_me_immediately_for_prod_32_bytes_min}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
